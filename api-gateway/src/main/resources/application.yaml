spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: http://auth-service:4001
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: http://user-service:4000
              predicates:
                - Path=/api/v1/users/**
              filters:
                - JwtValidation

            - id: device-provisioning
              uri: http://device-service:4002
              predicates:
                - Path=/api/v1/devices/provision

            - id: device-service
              uri: http://device-service:4002
              predicates:
                - Path=/api/v1/devices/**
              filters:
                - JwtValidation

            - id: circle-service
              uri: http://circle-service:4003
              predicates:
                - Path=/api/v1/circles/**
              filters:
                - JwtValidation

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      access: read-only