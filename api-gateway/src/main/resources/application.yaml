spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedHeaders: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
      server:
        webflux:
          routes:

            - id: auth-service
              uri: http://auth-service:4001
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: http://user-service:4000
              predicates:
                - Path=/api/v1/users/**
              filters:
                - JwtValidation

            - id: public-light-state
              uri: http://device-service:4002
              predicates:
                - Path=/api/v1/devices/{deviceId}/light
                - Method=GET, PATCH

            - id: device-provisioning
              uri: http://device-service:4002
              predicates:
                - Path=/api/v1/devices/provision

            - id: device-service
              uri: http://device-service:4002
              predicates:
                - Path=/api/v1/devices/**
              filters:
                - JwtValidation

            - id: circle-service
              uri: http://circle-service:4003
              predicates:
                - Path=/api/v1/circles/**
              filters:
                - JwtValidation

            - id: message-service
              uri: http://message-service:4004
              predicates:
                - Path=/api/v1/messages/**
              filters:
                - JwtValidation

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      access: read-only