syntax = "proto3";

option java_multiple_files = true;
option java_package = "circleservice";

service CircleAuthorizationService {

  rpc CanUserSendMessage(CanUserSendMessageRequest)
      returns (CanUserSendMessageResponse);
}

message CanUserSendMessageRequest {
  string user_id = 1;
  string device_id = 2;
}

message CanUserSendMessageResponse {
  bool allowed = 1;
}