spring.application.name=circle-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5003/circle_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:circle_service}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:onelight_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

server.port=${SERVER_PORT:4003}

# ===============================
# gRPC Server
# ===============================
grpc.server.port=9093

grpc.device-service.host=${GRPC_DEVICE_SERVICE_HOST:localhost}
grpc.device-service.port=${GRPC_DEVICE_SERVICE_PORT:9094}

logging.level.root=info

management.endpoints.web.exposure.include=health,info