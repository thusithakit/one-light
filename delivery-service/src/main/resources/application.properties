spring.application.name=delivery-service

# PostgreSQL - database owned by Delivery Service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5005/delivery_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9096}

spring.kafka.consumer.group-id=onelight-delivery-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.thusithakit.deliveryservice.dto.MessageCreatedEventDTO
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.thusithakit.deliveryservice.dto
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

spring.kafka.listener.ack-mode=record

# Kafka topic
onelight.kafka.message-created-topic=onelight.message.created

# MQTT / Mosquitto
onelight.mqtt.broker-uri=${MQTT_BROKER_URI:tcp://localhost:1883}
onelight.mqtt.username=${MQTT_USERNAME:onelight_admin}
onelight.mqtt.password=${MQTT_PASSWORD:change-this-password}

# Logging
logging.level.com.thusithakit.deliveryservice=INFO
logging.level.org.springframework.kafka=INFO